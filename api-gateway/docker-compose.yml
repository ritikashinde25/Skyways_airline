version: '3.8'
 
services:
 
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
 
  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
 
  user-auth-service:
    build: ../user-auth-service
    ports:
      - "8084:8084"
    depends_on:
      - kafka
 
  flight-search-service:
    build: ../flight-search-service
    ports:
      - "8085:8085"
    depends_on:
      - kafka
 
  booking-service:
    build: ../booking-service
    ports:
      - "8086:8086"
    depends_on:
      - kafka
 
  payment-service:
    build: ../payment-service
    ports:
      - "8087:8087"
    depends_on:
      - kafka
 
  notification-service:
    build: ../notification-service
    ports:
      - "8088:8088"
    depends_on:
      - kafka
 
  api-gateway:
    build: ../api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - kafka
 